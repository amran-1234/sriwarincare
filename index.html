<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sriwarin Care - ระบบสแกนใบหน้า</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-blue-100 via-white to-pink-100 min-h-screen p-4 flex items-center justify-center">
    
    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row border border-pink-100">
        
        <!-- ฝั่งซ้าย: แสดงภาพจากกล้อง (ใช้ร่วมกันทั้ง 2 โหมด) -->
        <div class="w-full md:w-1/2 bg-slate-900 p-6 flex flex-col items-center justify-center relative min-h-[350px]">
            <video id="video" class="w-full max-w-sm rounded-lg shadow-lg hidden object-cover" autoplay muted playsinline></video>
            
            <div id="loader" class="text-white text-center absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 z-10">
                <svg class="animate-spin h-10 w-10 text-pink-500 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p id="statusText" class="text-lg font-medium text-blue-200">กำลังเตรียมระบบ AI...</p>
            </div>
        </div>

        <!-- ฝั่งขวา: พื้นที่จัดการข้อมูล -->
        <div class="w-full md:w-1/2 p-8 flex flex-col">
            
            <!-- ปุ่มสลับโหมด (Tabs) -->
            <div class="flex bg-gray-100 rounded-lg p-1 mb-6">
                <button id="tabStudent" class="flex-1 py-2 px-4 rounded-md text-sm font-semibold shadow bg-white text-blue-600 transition">
                    👨‍🎓 โหมดนักเรียน (เช็คอิน)
                </button>
                <button id="tabAdmin" class="flex-1 py-2 px-4 rounded-md text-sm font-semibold text-gray-500 hover:text-gray-700 transition">
                    ⚙️ โหมด Admin (ลงทะเบียน)
                </button>
            </div>

            <!-- ============================== -->
            <!-- 1. ฟอร์มสำหรับนักเรียน (Student) -->
            <!-- ============================== -->
            <div id="formStudent" class="flex-1 flex flex-col justify-center space-y-4">
                <h2 class="text-2xl font-bold text-blue-600 text-center">เช็คอินเข้าเรียน</h2>
                <p class="text-center text-gray-500 text-sm mb-2">สแกนใบหน้าและบอกเราหน่อยว่าวันนี้คุณรู้สึกอย่างไร</p>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">วันนี้นักเรียนรู้สึกอย่างไรบ้าง? 💬</label>
                    <textarea id="studentFeeling" rows="3" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 focus:border-blue-400 outline-none transition resize-none" placeholder="เช่น วันนี้รู้สึกสดชื่นพร้อมเรียนมากครับ หรือ ช่วงนี้เครียดเรื่องสอบจัง..."></textarea>
                </div>
                
                <button id="btnCheckIn" class="w-full mt-4 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition transform hover:-translate-y-0.5">
                    📸 สแกนใบหน้า & ส่งความรู้สึก
                </button>
            </div>

            <!-- ============================== -->
            <!-- 2. ฟอร์มสำหรับ Admin (ลงทะเบียน) -->
            <!-- ============================== -->
            <div id="formAdmin" class="hidden flex-1 flex flex-col justify-center space-y-4">
                <h2 class="text-2xl font-bold text-pink-600 text-center">ลงทะเบียนใบหน้า</h2>
                
                <div>
                    <input type="text" id="admin_student_id" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none" placeholder="รหัสนักเรียน (เช่น 6901)">
                </div>
                <div>
                    <input type="text" id="admin_name" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none" placeholder="ชื่อ-สกุล">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="admin_classroom" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none" placeholder="ห้องเรียน">
                    <input type="text" id="admin_advisor" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400 outline-none" placeholder="ครูที่ปรึกษา">
                </div>
                
                <button id="btnRegister" class="w-full mt-4 bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition transform hover:-translate-y-0.5">
                    ✨ บันทึกข้อมูลเข้าฐานข้อมูล
                </button>
            </div>

        </div>
    </div>

    <script>
        // --- การจัดการ UI สลับโหมด ---
        const tabStudent = document.getElementById('tabStudent');
        const tabAdmin = document.getElementById('tabAdmin');
        const formStudent = document.getElementById('formStudent');
        const formAdmin = document.getElementById('formAdmin');

        tabStudent.addEventListener('click', () => {
            // สลับปุ่ม
            tabStudent.classList.replace('text-gray-500', 'text-blue-600');
            tabStudent.classList.replace('hover:text-gray-700', 'shadow');
            tabStudent.classList.add('bg-white');
            
            tabAdmin.classList.replace('text-blue-600', 'text-gray-500');
            tabAdmin.classList.replace('shadow', 'hover:text-gray-700');
            tabAdmin.classList.remove('bg-white');

            // สลับฟอร์ม
            formStudent.classList.remove('hidden');
            formAdmin.classList.add('hidden');
        });

        tabAdmin.addEventListener('click', () => {
            // สลับปุ่ม
            tabAdmin.classList.replace('text-gray-500', 'text-blue-600');
            tabAdmin.classList.replace('hover:text-gray-700', 'shadow');
            tabAdmin.classList.add('bg-white');
            
            tabStudent.classList.replace('text-blue-600', 'text-gray-500');
            tabStudent.classList.replace('shadow', 'hover:text-gray-700');
            tabStudent.classList.remove('bg-white');

            // สลับฟอร์ม
            formAdmin.classList.remove('hidden');
            formStudent.classList.add('hidden');
        });

        // --- ระบบกล้องและ AI (คงเดิม) ---
        const video = document.getElementById('video');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('statusText');

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

                loader.style.display = 'none';
                startCamera();
            } catch (error) {
                alert("โหลด AI ไม่สำเร็จ โปรดตรวจสอบเน็ต");
            }
        });

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: {} });
                video.srcObject = stream;
                video.classList.remove('hidden');
            } catch (err) {
                alert("กรุณาอนุญาตให้ใช้งานกล้อง");
            }
        }

        // TODO: เดี๋ยวเราจะมาเขียนโค้ดสำหรับปุ่ม btnCheckIn (นักเรียน) และ btnRegister (Admin) ในขั้นตอนต่อไปครับ
    </script>
</body>
</html>
